spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# JWT Configuration for testing
jwt.access.expiration=900000
jwt.access.secret=testSecretKeyForAccessTokenThatIsLongEnoughForHS256Algorithm
jwt.refresh.secret=testSecretKeyForRefreshTokenThatIsLongEnoughForHS256Algorithm
jwt.refresh.expiration=604800000
# Test paths
export.path=/tmp/export
attachments.folder=/tmp/attachments
max.labels.per.print=100
# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Zebra printer (LabelPrinter needs these)
zebra.apikey=test-api-key
zebra.tenant=test-tenant
zebra.sn=test-sn
# Disable actuator endpoints in tests
management.endpoints.enabled-by-default=false

