# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/majetek
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# JWT Configuration
# Access token expiration 15 minutes
jwt.access.expiration=900000
# Access token secret
jwt.access.secret=${JWT_SECRET}
# Refresh token secret
jwt.refresh.secret=${JWT_REFRESH_SECRET}
# Refresh token expiration 7 days
jwt.refresh.expiration=604800000
# Server Configuration
server.port=8080
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_FILE_SIZE}
# Logging: configured in logback-spring.xml
# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=true