# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/majetek
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration - 1d
jwt.expiration=86400000

# Server Configuration
server.port=8080
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_FILE_SIZE}

# Logging Configuration
logging.level.root=INFO
logging.level.cz.majetek=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=true