# ──────────────────────────────────────────────
# SonarQube – Monorepo konfigurace (majetek)
# ──────────────────────────────────────────────

sonar.projectKey=ondrasovka04_majetek
sonar.projectName=majetek
sonar.organization=ondrasovka04

# Kódování zdrojových souborů
sonar.sourceEncoding=UTF-8

# ── Moduly ────────────────────────────────────
sonar.modules=backend,android,frontend

# ── Backend (Spring Boot / Java) ──────────────
backend.sonar.projectName=Backend
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.java.libraries=target/*.jar
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
backend.sonar.exclusions=**/dto/**,**/entity/**,**/config/**,**/mapper/**

# ── Android (Java) ────────────────────────────
android.sonar.projectName=Android
android.sonar.projectBaseDir=android
android.sonar.sources=app/src/main/java
android.sonar.tests=app/src/test/java
android.sonar.java.binaries=app/build/intermediates/javac/debug/classes
android.sonar.java.test.binaries=app/build/intermediates/javac/debugUnitTest/classes

# ── Frontend (TypeScript / React) ─────────────
frontend.sonar.projectName=Frontend
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.tests=src/test
frontend.sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.ts,**/*.test.tsx
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
